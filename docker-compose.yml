# Local stack for development and evals (docs/v1-design.md §12). No vendor accounts needed.
# Local runs use NODE_ENV=test, which enables the test-only routes the evals depend on.
# Local object store: adobe/s3mock (S3 API). Production uses Cloudflare R2 through the same S3 API.
x-api-env: &api-env
  NODE_ENV: test
  DATABASE_URL: postgres://postgres:postgres@db:5432/kindtree
  S3_ENDPOINT: http://s3mock:9090
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: local-access-key
  S3_SECRET_ACCESS_KEY: local-secret-key
  S3_BUCKET_PUBLIC: kindtree-media
  S3_BUCKET_PRIVATE: kindtree-private
  LOG_LEVEL: info
  BETTER_AUTH_SECRET: local-dev-secret-not-for-production-0123456789
  BETTER_AUTH_URL: http://localhost:3000
  PASSKEY_RP_ID: localhost
  PASSKEY_ORIGINS: http://localhost:3000
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: Kindtree <no-reply@kindtree.test>

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kindtree
    # Host port 55432 avoids clashing with a locally installed Postgres on 5432.
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kindtree"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3mock:
    image: adobe/s3mock:latest
    # Buckets are created by the storage-init service (s3mock does not create them at boot).
    ports: ["9090:9090"]

  migrate:
    build: .
    command: ["node", "dist/db/migrate-cli.js"]
    environment:
      <<: *api-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  storage-init:
    build: .
    command: ["node", "dist/cli/ensure-buckets.js"]
    environment:
      <<: *api-env
    depends_on:
      s3mock: { condition: service_started }
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  api:
    build: .
    environment:
      <<: *api-env
      APP_ROLE: api
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }

  worker:
    build: .
    environment:
      <<: *api-env
      APP_ROLE: worker
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
